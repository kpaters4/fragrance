<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fragrance Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" />
<style>
  :root[data-theme="light"] {
    --bg: #f3f0ea; --panel: #fbfaf7; --ink: #3a3833; --muted: #857f74; --faint: #a79f92;
    --rule: #e6e1d7; --input-rule: #cfc8bb; --accent: #6d7d6b; --on-accent: #f8f7f3;
    --label-ink: #6d675d; --label-bg: rgba(251, 250, 247, 0.82); --track-bg: #e0dad0; --knob-left: 2px;
    --error: #a3554c;
  }
  :root[data-theme="dark"] {
    --bg: #1b1d1b; --panel: #232622; --ink: #e9e7e1; --muted: #9aa096; --faint: #75796e;
    --rule: #32362f; --input-rule: #3f443c; --accent: #9db59a; --on-accent: #1b1d1b;
    --label-ink: #c3c8bd; --label-bg: rgba(27, 29, 27, 0.78); --track-bg: #343a32; --knob-left: 18px;
    --error: #d99a92;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Jost, Helvetica, Arial, sans-serif;
    font-weight: 300;
    background: var(--bg);
    color: var(--ink);
    transition: background 0.35s ease, color 0.35s ease;
  }
  a { color: var(--accent); text-decoration: none; }
  input::placeholder { color: var(--faint); }

  .page { min-height: 100vh; padding: 52px 20px 72px; display: flex; justify-content: center; }
  .shell { width: 100%; max-width: 1180px; display: flex; flex-direction: column; gap: 36px; }

  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; flex-wrap: wrap; }
  .wordmark { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 300; font-size: 58px; line-height: 1; letter-spacing: 0.01em; }
  .tagline { font-size: 17px; margin-top: 14px; letter-spacing: 0.02em; color: var(--muted); }
  .top-right { display: flex; align-items: center; gap: 22px; }
  .corpus-count { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--faint); min-width: 1px; }

  .theme-toggle {
    display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px;
    border: 1px solid var(--rule); background: transparent; border-radius: 999px; cursor: pointer;
    font-family: inherit; font-weight: 300; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--faint);
  }
  .track { width: 34px; height: 18px; border-radius: 999px; position: relative; display: inline-block; transition: background 0.3s ease; background: var(--track-bg); }
  .knob { position: absolute; top: 2px; width: 14px; height: 14px; border-radius: 50%; transition: left 0.3s ease, background 0.3s ease; left: var(--knob-left); background: var(--accent); }

  .columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 56px; align-items: start; }
  .eyebrow { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--faint); }

  .map-col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .map-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .hover-label { font-size: 13px; color: var(--muted); }
  .map-wrap { position: relative; height: 480px; border-radius: 18px; overflow: hidden; transition: background 0.35s ease; background: var(--panel); border: 1px solid var(--rule); }
  .map-canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  .map-canvas.dragging { cursor: grabbing; }
  .map-labels, .map-tooltip { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .map-controls {
    position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px;
    z-index: 2;
  }
  .map-ctrl-btn {
    width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--rule); background: var(--label-bg);
    color: var(--label-ink); font-family: inherit; font-size: 14px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background 0.15s ease, color 0.15s ease, opacity 0.15s ease;
  }
  .map-ctrl-btn:hover { background: var(--accent); color: var(--on-accent); }
  .map-ctrl-btn:disabled { opacity: 0.35; cursor: default; background: var(--label-bg); color: var(--label-ink); }
  .map-hint { font-size: 12px; letter-spacing: 0.02em; color: var(--faint); }
  .cluster-pill {
    position: absolute; transform: translate(-50%, -50%); font-size: 12px; letter-spacing: 0.06em;
    padding: 4px 9px; border-radius: 999px; white-space: nowrap; color: var(--label-ink); background: var(--label-bg);
    pointer-events: auto; cursor: pointer; transition: background 0.15s ease, color 0.15s ease;
  }
  .cluster-pill:hover, .cluster-pill.active { background: var(--accent); color: var(--on-accent); }
  .point-tooltip {
    position: absolute; transform: translate(-50%, -135%); font-size: 12px; letter-spacing: 0.02em;
    padding: 6px 11px; border-radius: 10px; white-space: nowrap; color: var(--label-ink); background: var(--label-bg);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12); opacity: 0; transition: opacity 0.1s ease;
  }
  .point-tooltip.visible { opacity: 1; }
  .point-tooltip .tt-brand { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }

  .legend { display: flex; gap: 22px; flex-wrap: wrap; font-size: 13px; letter-spacing: 0.02em; color: var(--muted); }
  .legend span.item { display: flex; align-items: center; gap: 8px; }
  .legend .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  .form-col { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
  .prompt-block { display: flex; flex-direction: column; gap: 16px; }
  .prompt-title { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 300; font-size: 30px; }
  .notes-input {
    width: 100%; padding: 18px 0; border: none; background: transparent; font-family: inherit;
    font-weight: 300; font-size: 17px; outline: none; border-bottom: 1px solid var(--input-rule); color: var(--ink);
  }
  .action-row { display: flex; gap: 14px; align-items: center; }
  .analyze-btn {
    padding: 15px 34px; border: none; border-radius: 999px; cursor: pointer; font-family: inherit;
    font-weight: 400; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase;
    transition: background 0.3s ease, opacity 0.2s ease; background: var(--accent); color: var(--on-accent);
  }
  .analyze-btn:disabled { opacity: 0.6; cursor: default; }
  .k-note { font-size: 13px; letter-spacing: 0.06em; color: var(--faint); }

  .similarity-line { font-size: 17px; letter-spacing: 0.02em; color: var(--ink); }
  .similarity-line .pct { color: var(--accent); }

  .nearest-block { display: flex; flex-direction: column; }
  .nearest-block .eyebrow { margin-bottom: 16px; }
  .match-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--rule); cursor: pointer; transition: opacity 0.15s ease; }
  .match-row:hover { opacity: 0.65; }
  .match-perfume { font-size: 17px; font-weight: 400; }
  .match-brand { font-size: 12px; margin-top: 4px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
  .match-sim { font-size: 14px; color: var(--accent); }

  .error-text { font-size: 13px; color: var(--error); }
  .muted-text { font-size: 13px; color: var(--muted); }

  .loading-overlay {
    position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center;
    background: var(--bg); transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  .loading-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .loading-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .loading-mark { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 300; font-size: 34px; letter-spacing: 0.02em; color: var(--ink); }
  .loading-dots { display: flex; gap: 8px; }
  .loading-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: loading-pulse 1.1s infinite ease-in-out; }
  .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes loading-pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }

  .legend span.item { cursor: pointer; border-radius: 999px; padding: 2px 6px; margin: -2px -6px; transition: background 0.15s ease, color 0.15s ease; }
  .legend span.item:hover, .legend span.item.active { background: var(--rule); color: var(--ink); }

  .detail-overlay {
    position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
    background: rgba(20, 18, 15, 0.35); opacity: 0; visibility: hidden; padding: 24px;
    transition: opacity 0.25s ease, visibility 0.25s ease;
  }
  .detail-overlay.visible { opacity: 1; visibility: visible; }
  .detail-card {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 18px; padding: 36px 40px;
    max-width: 420px; width: 100%; position: relative; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
    transform: translateY(8px); transition: transform 0.25s ease;
  }
  .detail-overlay.visible .detail-card { transform: translateY(0); }
  .detail-close {
    position: absolute; top: 14px; right: 16px; border: none; background: transparent; color: var(--faint);
    font-size: 22px; line-height: 1; cursor: pointer; padding: 4px;
  }
  .detail-close:hover { color: var(--ink); }
  .detail-family { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); margin-bottom: 10px; }
  .detail-perfume { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 400; font-size: 28px; line-height: 1.15; }
  .detail-brand { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .detail-notes { font-size: 14px; line-height: 1.6; color: var(--muted); margin-top: 18px; }
  .detail-similarity { font-size: 13px; color: var(--accent); margin-top: 14px; }
  .detail-similar {
    display: inline-block; margin-top: 22px; background: none; border: none; padding: 0; font-family: inherit;
    font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); cursor: pointer;
  }
  .detail-similar:hover { color: var(--ink); }
  .info-list {
    margin-top: 20px; max-height: 240px; overflow-y: auto; display: flex; flex-direction: column;
    scrollbar-width: thin; scrollbar-color: var(--faint) transparent;
  }
  .info-list .match-row:last-child { border-bottom: none; }
  .info-list::-webkit-scrollbar { width: 4px; }
  .info-list::-webkit-scrollbar-track { background: transparent; }
  .info-list::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 999px; }
  .info-list::-webkit-scrollbar-button { display: none; height: 0; width: 0; }
  .info-list-more { font-size: 12px; color: var(--faint); padding: 10px 0 0; }
  .wheel-img { display: block; width: 100%; border-radius: 10px; margin: 2px 0 16px; }
  .wheel-link { display: block; margin-top: 10px; }
</style>
</head>
<body>
<div class="loading-overlay" id="loading-overlay">
  <div class="loading-inner">
    <div class="loading-mark">Fragrance Map</div>
    <div class="loading-dots"><span></span><span></span><span></span></div>
  </div>
</div>

<div class="detail-overlay" id="detail-overlay">
  <div class="detail-card">
    <button type="button" class="detail-close" id="detail-close" aria-label="Close">&times;</button>
    <div class="detail-family" id="detail-family"></div>
    <div class="detail-perfume" id="detail-perfume"></div>
    <div class="detail-brand" id="detail-brand"></div>
    <div class="detail-notes" id="detail-notes"></div>
    <div class="detail-similarity" id="detail-similarity"></div>
    <button type="button" class="detail-similar" id="detail-similar">Find similar &rarr;</button>
  </div>
</div>

<div class="detail-overlay" id="info-overlay">
  <div class="detail-card">
    <button type="button" class="detail-close" id="info-close" aria-label="Close">&times;</button>
    <div class="detail-family" id="info-eyebrow"></div>
    <div class="detail-perfume" id="info-title"></div>
    <div class="detail-notes" id="info-body"></div>
    <div class="info-list" id="info-list"></div>
  </div>
</div>

<div class="page">
  <div class="shell">

    <div class="top">
      <div>
        <div class="wordmark">Fragrance Map</div>
        <div class="tagline">Explore fragrances by their notes and find similar ones. <a href="#" id="wheel-info-link">Learn more about the fragrance wheel.</a></div>
      </div>
      <div class="top-right">
        <div class="corpus-count" id="corpus-count"></div>
        <button type="button" class="theme-toggle" id="theme-toggle" title="Toggle dark mode">
          <span id="theme-label">Light</span>
          <span class="track"><span class="knob" id="theme-knob"></span></span>
        </button>
      </div>
    </div>

    <div class="columns">

      <div class="map-col">
        <div class="map-head">
          <div class="eyebrow">The map</div>
          <div class="hover-label" id="hover-label">hover a dot</div>
        </div>
        <div class="map-wrap" id="map-wrap">
          <canvas class="map-canvas" id="map-canvas"></canvas>
          <div class="map-labels" id="map-labels"></div>
          <div class="map-tooltip"><div class="point-tooltip" id="point-tooltip"></div></div>
          <div class="map-controls" id="map-controls">
            <button type="button" class="map-ctrl-btn" id="zoom-in" aria-label="Zoom in">+</button>
            <button type="button" class="map-ctrl-btn" id="zoom-out" aria-label="Zoom out">&minus;</button>
            <button type="button" class="map-ctrl-btn" id="zoom-reset" aria-label="Reset zoom" title="Reset view">&#8634;</button>
          </div>
        </div>
        <div class="legend" id="legend"></div>
        <div class="map-hint">Scroll or pinch to zoom &middot; drag to pan</div>
        <div id="map-error" class="error-text"></div>
      </div>

      <div class="form-col">
        <div class="prompt-block">
          <div class="prompt-title">What does it smell like?</div>
          <input type="text" id="notes-input" class="notes-input" placeholder="sandalwood, iris, leather, musk" value="sandalwood, cardamom, iris, violet, leather" />
          <div class="action-row">
            <button type="button" id="analyze-btn" class="analyze-btn">Analyze</button>
            <span class="k-note">5 nearest</span>
          </div>
          <div id="analyze-error" class="error-text"></div>
        </div>

        <div class="similarity-line" id="similarity-line"></div>

        <div class="nearest-block">
          <div class="eyebrow">Nearest</div>
          <div id="matches-list"><p class="muted-text">Enter some notes and hit Analyze.</p></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  // Must point at the deployed Modal URL. No localhost, no mocked data.
  const API_BASE = "https://kpaters4--scent-fingerprint-fastapi-app.modal.run";

  // Matches build.py's FAMILY_LABELS -- the 4 main families of the 2010
  // revision of the Fragrance Wheel (Oriental was renamed to Amber).
  const FAMILY_ORDER = ["floral", "amber", "woody", "fresh"];
  const SPA_LIGHT = ["#c0a2a8", "#c2a07e", "#a89478", "#9aab94"];
  const SPA_DARK = ["#c2a0ab", "#c7a681", "#ab977a", "#8fae92"];

  function familyColor(familyId, dark) {
    const idx = FAMILY_ORDER.indexOf(familyId);
    const palette = dark ? SPA_DARK : SPA_LIGHT;
    return palette[idx >= 0 ? idx : 0];
  }

  // Short descriptions for the click-to-learn-more popup, keyed the same way
  // build.py keys FAMILY_LABELS / SUBFAMILY_KEYWORDS.
  const MAIN_FAMILY_INFO = {
    floral: "Fragrances built around flower notes -- the largest and most classic family, spanning delicate single-flower scents to warm, spice-laced florals.",
    amber: "Warm, rich, and sweet -- built on amber, resins, spices, and vanilla. Long-lasting and sensual; modern gourmand desserts-in-a-bottle scents live here too.",
    woody: "Dry, earthy, and grounding -- sandalwood, cedar, vetiver, and mossy or smoky woods anchor these fragrances, often as a base for other families.",
    fresh: "Light and energizing -- citrus, green leaves, aquatic air, herbs, and fruit. The most casual, everyday-wearing family.",
  };
  const SUBFAMILY_INFO = {
    "Floral": "Fresh cut flowers -- rose, jasmine, and other blooms front and center, without much sweetness or spice layered on top.",
    "Soft Floral": "Aldehydes and powdery notes -- violet, iris, and aldehydes give a soft, almost powdered-skin feel.",
    "Floral Amber": "Orange blossom and sweet spices -- heady white flowers like tuberose and ylang-ylang, warmed with a touch of amber.",
    "Soft Amber": "Incense and amber -- vanilla, benzoin, and incense, without the full spice-and-resin intensity of a true Amber.",
    "Amber": "Oriental resins -- labdanum, myrrh, and warm spices like cardamom and cinnamon, often with a sweet, gourmand edge from vanilla or praline.",
    "Woody Amber": "Sandalwood and patchouli meeting amber and spice -- dark, dense, and long-lasting.",
    "Woods": "Aromatic woods and vetiver -- sandalwood, cedar, vetiver -- dry and grounding without much sweetness.",
    "Mossy Woods": "Oakmoss and amber -- earthy oakmoss and patchouli give an old-school, green-wood depth.",
    "Dry Woods": "Dry woods and leather -- birch, leather, tobacco -- with a rougher, more austere edge.",
    "Citrus": "Bergamot and citrus oils -- bright lemon and orange peel -- the classic, zesty top-note family.",
    "Water": "Marine and aquatic notes -- clean, airy \"sea breeze\" accords that evoke water rather than any actual flower or wood.",
    "Green": "Galbanum and green notes -- crushed leaves and stems give a sharp, just-cut-grass freshness.",
    "Aromatic": "Lavender and aromatic herbs -- rosemary, mint, and sage -- giving a cool, savory freshness rather than a fruity or floral one.",
    "Fruity": "Berries and fruits -- ripe orchard and berry fruit -- usually layered into a floral or gourmand base rather than standing alone.",
  };

  // --- Learn-more popup (families and subfamilies) ---
  const infoOverlay = document.getElementById("info-overlay");
  const infoEyebrow = document.getElementById("info-eyebrow");
  const infoTitle = document.getElementById("info-title");
  const infoBody = document.getElementById("info-body");
  const infoClose = document.getElementById("info-close");
  const infoList = document.getElementById("info-list");
  const INFO_LIST_LIMIT = 40;

  function familyLabel(familyId) {
    const fam = clusterState && clusterState.families.find((f) => f.id === familyId);
    return fam ? fam.label : familyId;
  }

  // Optional `members`: fragrances belonging to a clicked subfamily cluster.
  // With thousands of dots packed into a small map, most cluster dots sit
  // too close together to click individually -- this list lets you reach
  // any of them from the popup instead of hunting for a clickable gap.
  function renderInfoList(members) {
    if (!members || !members.length) {
      infoList.innerHTML = "";
      return;
    }
    const shown = members.slice(0, INFO_LIST_LIMIT);
    const rows = shown.map((p, i) => `
      <div class="match-row" data-idx="${i}">
        <div>
          <div class="match-perfume">${p.perfume}</div>
          <div class="match-brand">${p.brand}</div>
        </div>
      </div>
    `).join("");
    const more = members.length > shown.length
      ? `<div class="info-list-more">+${members.length - shown.length} more in this cluster</div>`
      : "";
    infoList.innerHTML = rows + more;
    infoList.querySelectorAll(".match-row").forEach((el, i) => {
      el.addEventListener("click", () => {
        closeInfo();
        openDetail(shown[i]);
      });
    });
  }

  function openInfo(eyebrow, title, body, members) {
    infoEyebrow.textContent = eyebrow;
    infoTitle.textContent = title;
    infoBody.textContent = body || "";
    renderInfoList(members);
    infoOverlay.classList.add("visible");
  }

  function closeInfo() {
    infoOverlay.classList.remove("visible");
  }

  infoClose.addEventListener("click", closeInfo);
  infoOverlay.addEventListener("click", (e) => {
    if (e.target === infoOverlay) closeInfo();
  });

  function openWheelInfo() {
    infoEyebrow.textContent = "About";
    infoTitle.textContent = "The Fragrance Wheel";
    infoBody.innerHTML = `
      <img class="wheel-img" src="fragrance-wheel.png" alt="Michael Edwards Fragrance Wheel" />
      Devised by fragrance critic Michael Edwards, the wheel groups fragrances into four main
      families -- Floral, Amber, Woody, and Fresh -- each split into related subfamilies, arranged
      so that neighboring families share a similar character. This map places every fragrance by
      its notes and colors it by the wheel family it falls into.
      <a class="wheel-link" href="https://en.wikipedia.org/wiki/Fragrance_wheel" target="_blank" rel="noopener noreferrer">Read more on Wikipedia &rarr;</a>
    `;
    renderInfoList();
    infoOverlay.classList.add("visible");
  }

  document.getElementById("wheel-info-link").addEventListener("click", (e) => {
    e.preventDefault();
    openWheelInfo();
  });

  // --- Theme ---
  const root = document.documentElement;
  const themeToggle = document.getElementById("theme-toggle");
  const themeLabel = document.getElementById("theme-label");

  function isDark() { return root.getAttribute("data-theme") === "dark"; }

  function applyTheme(dark) {
    root.setAttribute("data-theme", dark ? "dark" : "light");
    themeLabel.textContent = dark ? "Dark" : "Light";
    if (clusterState) drawDots(hoverIndex);
    renderLegend();
  }

  function initTheme() {
    let stored = null;
    try { stored = localStorage.getItem("fragrance-theme"); } catch (e) {}
    applyTheme(stored === "dark");
  }

  themeToggle.addEventListener("click", () => {
    const dark = !isDark();
    try { localStorage.setItem("fragrance-theme", dark ? "dark" : "light"); } catch (e) {}
    applyTheme(dark);
  });

  // --- Header corpus count ---
  async function loadInfo() {
    try {
      const res = await fetch(`${API_BASE}/info`);
      if (!res.ok) throw new Error();
      const data = await res.json();
      document.getElementById("corpus-count").textContent = `${data.corpus_size.toLocaleString()} perfumes`;
    } catch (e) {
      document.getElementById("corpus-count").textContent = "";
    }
  }

  // --- Analyze ---
  const notesInput = document.getElementById("notes-input");
  const analyzeBtn = document.getElementById("analyze-btn");
  const analyzeError = document.getElementById("analyze-error");
  const similarityLine = document.getElementById("similarity-line");
  const matchesList = document.getElementById("matches-list");

  function renderSimilarity(stats) {
    const pct = Math.round(100 - stats.niche_score);
    similarityLine.innerHTML = `This is similar to <span class="pct">${pct}%</span> of fragrances.`;
  }

  let lastMatches = [];

  function renderMatches(matches) {
    lastMatches = matches;
    if (!matches.length) {
      matchesList.innerHTML = '<p class="muted-text">No matches found.</p>';
      return;
    }
    matchesList.innerHTML = matches.map((m, i) => `
      <div class="match-row" data-idx="${i}">
        <div>
          <div class="match-perfume">${m.perfume}</div>
          <div class="match-brand">${m.brand}</div>
        </div>
        <div class="match-sim">${(m.similarity * 100).toFixed(1)}%</div>
      </div>`).join("");
    matchesList.querySelectorAll(".match-row").forEach((el) => {
      el.addEventListener("click", () => {
        const m = lastMatches[Number(el.dataset.idx)];
        if (m) openDetail(m, { similarity: m.similarity });
      });
    });
  }

  async function analyze() {
    const notes = notesInput.value.split(",").map(n => n.trim()).filter(Boolean);
    analyzeError.textContent = "";
    if (!notes.length) {
      analyzeError.textContent = "Enter at least one note.";
      return;
    }
    analyzeBtn.disabled = true;
    analyzeBtn.textContent = "Reading…";
    try {
      const res = await fetch(`${API_BASE}/analyze`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ notes, k: 5 }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail ? JSON.stringify(body.detail) : `Request failed (${res.status})`);
      }
      const data = await res.json();
      renderSimilarity(data.stats);
      renderMatches(data.matches);
    } catch (err) {
      analyzeError.textContent = err.message || "Something went wrong.";
    } finally {
      analyzeBtn.disabled = false;
      analyzeBtn.textContent = "Analyze";
    }
  }

  analyzeBtn.addEventListener("click", analyze);
  notesInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") analyze();
  });

  // --- The map ---
  const mapCanvas = document.getElementById("map-canvas");
  const mapWrap = document.getElementById("map-wrap");
  const mapLabels = document.getElementById("map-labels");
  const pointTooltip = document.getElementById("point-tooltip");
  const hoverLabelEl = document.getElementById("hover-label");
  const legendEl = document.getElementById("legend");
  const mapError = document.getElementById("map-error");

  let clusterState = null;
  let hoverIndex = -1;
  let hoverRAF = null;

  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function project(state, x, y, w, h) {
    const pad = 26;
    const { minX, maxX, minY, maxY } = state.bounds;
    const sx = (x - minX) / ((maxX - minX) || 1);
    const sy = (y - minY) / ((maxY - minY) || 1);
    return { x: pad + sx * (w - pad * 2), y: pad + (1 - sy) * (h - pad * 2) };
  }

  // --- Zoom / pan ---
  // `view` is a scale + translate applied on top of the base `project()`
  // layout, in canvas-pixel space, so the underlying data layout never
  // changes -- only how it's framed on screen.
  const MIN_SCALE = 1;
  const MAX_SCALE = 14;
  let view = { scale: 1, tx: 0, ty: 0 };

  function clampNum(v, min, max) { return Math.min(max, Math.max(min, v)); }

  function toScreen(pos) {
    return { x: pos.x * view.scale + view.tx, y: pos.y * view.scale + view.ty };
  }

  // Convenience: base-project a data point straight into current screen space.
  function projectScreen(state, x, y, w, h) {
    return toScreen(project(state, x, y, w, h));
  }

  // Keeps the scaled content covering the canvas -- can't pan past its edges.
  function clampPan(w, h) {
    const minTx = Math.min(0, w - w * view.scale);
    const maxTx = Math.max(0, w - w * view.scale);
    view.tx = clampNum(view.tx, minTx, maxTx);
    const minTy = Math.min(0, h - h * view.scale);
    const maxTy = Math.max(0, h - h * view.scale);
    view.ty = clampNum(view.ty, minTy, maxTy);
  }

  function updateZoomControls() {
    const zoomInBtn = document.getElementById("zoom-in");
    const zoomOutBtn = document.getElementById("zoom-out");
    const zoomResetBtn = document.getElementById("zoom-reset");
    if (!zoomInBtn) return;
    zoomInBtn.disabled = view.scale >= MAX_SCALE - 1e-6;
    zoomOutBtn.disabled = view.scale <= MIN_SCALE + 1e-6;
    zoomResetBtn.disabled = view.scale <= MIN_SCALE + 1e-6 && view.tx === 0 && view.ty === 0;
  }

  // Zooms so the data point currently under (mx, my) stays under (mx, my).
  function zoomAt(mx, my, factor, w, h) {
    const newScale = clampNum(view.scale * factor, MIN_SCALE, MAX_SCALE);
    const applied = newScale / view.scale;
    if (applied === 1) return;
    view.tx = mx - (mx - view.tx) * applied;
    view.ty = my - (my - view.ty) * applied;
    view.scale = newScale;
    clampPan(w, h);
    redrawMap(hoverIndex);
    updateZoomControls();
  }

  function resetView() {
    view = { scale: 1, tx: 0, ty: 0 };
    redrawMap(hoverIndex);
    updateZoomControls();
  }

  function buildClusterState(data) {
    const points = data.points;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    points.forEach((p) => {
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    });

    const fineCentroids = {};
    const fineCounts = {};
    points.forEach((p) => {
      if (!fineCentroids[p.fine]) {
        fineCentroids[p.fine] = { x: 0, y: 0 };
        fineCounts[p.fine] = 0;
      }
      fineCentroids[p.fine].x += p.x;
      fineCentroids[p.fine].y += p.y;
      fineCounts[p.fine] += 1;
    });
    Object.keys(fineCentroids).forEach((id) => {
      fineCentroids[id].x /= fineCounts[id];
      fineCentroids[id].y /= fineCounts[id];
    });

    const fineLabelById = {};
    data.fine_clusters.forEach((fc) => { fineLabelById[fc.id] = fc; });

    return { points, families: data.families, bounds: { minX, maxX, minY, maxY }, fineCentroids, fineLabelById };
  }

  let hoveredFamily = null;

  function renderLegend() {
    if (!clusterState) return;
    const dark = isDark();
    legendEl.innerHTML = clusterState.families.map((fam) => `
      <span class="item${fam.id === hoveredFamily ? " active" : ""}" data-family="${fam.id}">
        <span class="dot" style="background:${familyColor(fam.id, dark)}"></span>${fam.label}
      </span>
    `).join("");
    legendEl.querySelectorAll(".item").forEach((el) => {
      el.addEventListener("mouseenter", () => {
        hoveredFamily = el.dataset.family;
        hoveredFine = null;
        el.classList.add("active");
        drawDots(hoverIndex);
        updateLabelActiveStates();
      });
      el.addEventListener("mouseleave", () => {
        hoveredFamily = null;
        el.classList.remove("active");
        drawDots(hoverIndex);
        updateLabelActiveStates();
      });
      el.addEventListener("click", () => {
        const fam = clusterState.families.find((f) => f.id === el.dataset.family);
        if (fam) openInfo("Fragrance Wheel family", fam.label, MAIN_FAMILY_INFO[fam.id]);
      });
    });
  }

  function measureLabelBox(text) {
    return { w: text.length * 6.4 + 18, h: 22 };
  }

  // Cluster centroids can sit close together in embedding space, which makes
  // their label pills overlap. Nudge colliding pairs apart along whichever
  // axis needs the smaller push, rather than showing stacked illegible text.
  function declutterLabels(labels, w, h) {
    const boxes = labels.map((l) => ({ ...l, ...measureLabelBox(l.text) }));
    for (let iter = 0; iter < 40; iter++) {
      let moved = false;
      for (let i = 0; i < boxes.length; i++) {
        for (let j = i + 1; j < boxes.length; j++) {
          const a = boxes[i], b = boxes[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const overlapX = (a.w + b.w) / 2 - Math.abs(dx);
          const overlapY = (a.h + b.h) / 2 - Math.abs(dy);
          if (overlapX > 0 && overlapY > 0) {
            moved = true;
            if (overlapX < overlapY) {
              const push = overlapX / 2 + 1;
              const dir = dx === 0 ? (i < j ? -1 : 1) : Math.sign(dx);
              a.x -= dir * push;
              b.x += dir * push;
            } else {
              const push = overlapY / 2 + 1;
              const dir = dy === 0 ? -1 : Math.sign(dy);
              a.y -= dir * push;
              b.y += dir * push;
            }
          }
        }
      }
      if (!moved) break;
    }
    boxes.forEach((b) => {
      b.x = Math.min(w - b.w / 2 - 4, Math.max(b.w / 2 + 4, b.x));
      b.y = Math.min(h - b.h / 2 - 4, Math.max(b.h / 2 + 4, b.y));
    });
    return boxes;
  }

  let hoveredFine = null;

  function renderClusterLabels() {
    if (!clusterState) return;
    const rect = mapCanvas.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const margin = 40;
    const raw = Object.keys(clusterState.fineCentroids).map((id) => {
      const meta = clusterState.fineLabelById[id];
      const c = clusterState.fineCentroids[id];
      const pos = projectScreen(clusterState, c.x, c.y, w, h);
      return meta ? { id, text: meta.label, family: meta.family, x: pos.x, y: pos.y } : null;
    }).filter((l) => l && l.x > -margin && l.x < w + margin && l.y > -margin && l.y < h + margin);
    const placed = declutterLabels(raw, w, h);
    mapLabels.innerHTML = placed.map((l) => {
      const isActive = l.id === hoveredFine || (hoveredFamily && l.family === hoveredFamily);
      return `<span class="cluster-pill${isActive ? " active" : ""}" data-fine="${l.id}" style="left:${l.x}px; top:${l.y}px;">${l.text}</span>`;
    }).join("");
    mapLabels.querySelectorAll(".cluster-pill").forEach((el) => {
      el.addEventListener("mouseenter", () => {
        hoveredFine = el.dataset.fine;
        hoveredFamily = null;
        renderLegend();
        drawDots(hoverIndex);
        updateLabelActiveStates();
      });
      el.addEventListener("mouseleave", () => {
        hoveredFine = null;
        drawDots(hoverIndex);
        updateLabelActiveStates();
      });
      el.addEventListener("click", () => {
        const fineId = el.dataset.fine;
        // Clicking a label always opens its subfamily popup, even when a
        // dot sits directly underneath -- the popup's member list is how
        // you reach dots packed too tightly under a pill to click directly.
        const meta = clusterState.fineLabelById[fineId];
        if (!meta) return;
        const members = clusterState.points
          .filter((p) => String(p.fine) === fineId)
          .sort((a, b) => a.perfume.localeCompare(b.perfume));
        openInfo(familyLabel(meta.family), meta.label, SUBFAMILY_INFO[meta.label], members);
      });
    });
  }

  // Draws only the canvas dots/highlight ring. Deliberately does NOT touch
  // the .cluster-pill DOM (see renderClusterLabels) -- rebuilding label
  // elements on every hover tick used to destroy the pill mid-click before
  // its click event could fire, silently swallowing clicks on labels.
  function drawDots(highlightIndex) {
    const state = clusterState;
    if (!state) return;
    const dark = isDark();
    const dpr = window.devicePixelRatio || 1;
    const rect = mapCanvas.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width));
    const h = Math.max(1, Math.round(rect.height));
    if (mapCanvas.width !== w * dpr || mapCanvas.height !== h * dpr) {
      mapCanvas.width = w * dpr;
      mapCanvas.height = h * dpr;
    }
    const ctx = mapCanvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    state.points.forEach((p, i) => {
      if (i === highlightIndex) return;
      const pos = projectScreen(state, p.x, p.y, w, h);
      if (pos.x < -4 || pos.x > w + 4 || pos.y < -4 || pos.y > h + 4) return;
      const dimmed = hoveredFine !== null
        ? String(p.fine) !== hoveredFine
        : (hoveredFamily && p.family !== hoveredFamily);
      const baseAlpha = dark ? 0.72 : 0.6;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, dimmed ? 1.8 : 2.2, 0, Math.PI * 2);
      ctx.fillStyle = hexToRgba(familyColor(p.family, dark), dimmed ? baseAlpha * 0.12 : baseAlpha);
      ctx.fill();
    });

    if (highlightIndex >= 0) {
      const p = state.points[highlightIndex];
      const pos = projectScreen(state, p.x, p.y, w, h);
      const color = familyColor(p.family, dark);
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = dark ? "#1b1d1b" : "#fbfaf7";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = color;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 2, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }
  }

  // Full redraw: dots + repositioning the label pills. Only needed when
  // positions can actually change (initial load, resize) -- not on hover.
  function redrawMap(highlightIndex) {
    drawDots(highlightIndex);
    renderClusterLabels();
  }

  // Toggles .active on existing pill elements without touching the DOM tree,
  // so a click on a pill can't be lost to a mid-interaction rebuild.
  function updateLabelActiveStates() {
    if (!clusterState) return;
    mapLabels.querySelectorAll(".cluster-pill").forEach((el) => {
      const meta = clusterState.fineLabelById[el.dataset.fine];
      const isActive = el.dataset.fine === hoveredFine || (hoveredFamily && meta && meta.family === hoveredFamily);
      el.classList.toggle("active", isActive);
    });
  }

  function findNearestIndex(mx, my, w, h, maxDist) {
    const state = clusterState;
    if (!state) return -1;
    let best = -1;
    let bestDist = maxDist * maxDist;
    for (let i = 0; i < state.points.length; i++) {
      const pos = projectScreen(state, state.points[i].x, state.points[i].y, w, h);
      const dx = pos.x - mx;
      const dy = pos.y - my;
      const d = dx * dx + dy * dy;
      if (d < bestDist) {
        bestDist = d;
        best = i;
      }
    }
    return best;
  }

  function updateHover(mx, my, w, h) {
    const state = clusterState;
    if (!state) return;
    const best = findNearestIndex(mx, my, w, h, 22);
    if (best !== hoverIndex) {
      hoverIndex = best;
      drawDots(hoverIndex);
    }
    if (best >= 0) {
      const p = state.points[best];
      const fine = state.fineLabelById[p.fine];
      hoverLabelEl.textContent = fine ? fine.label : "";
      pointTooltip.innerHTML = `<div class="tt-brand">${p.brand}</div>${p.perfume}`;
      pointTooltip.style.left = `${mx}px`;
      pointTooltip.style.top = `${my}px`;
      pointTooltip.classList.add("visible");
    } else {
      hoverLabelEl.textContent = "hover a dot";
      pointTooltip.classList.remove("visible");
    }
  }

  mapCanvas.addEventListener("mousemove", (e) => {
    if (isDragging) return;
    const rect = mapCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    if (hoverRAF) return;
    hoverRAF = requestAnimationFrame(() => {
      hoverRAF = null;
      updateHover(mx, my, rect.width, rect.height);
    });
  });

  mapCanvas.addEventListener("mouseleave", () => {
    hoverIndex = -1;
    hoverLabelEl.textContent = "hover a dot";
    pointTooltip.classList.remove("visible");
    drawDots(-1);
  });

  mapCanvas.addEventListener("click", (e) => {
    if (dragMoved) { dragMoved = false; return; }
    const rect = mapCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const idx = findNearestIndex(mx, my, rect.width, rect.height, 22);
    if (idx >= 0) openDetail(clusterState.points[idx]);
  });

  // --- Wheel zoom (mouse wheel + trackpad pinch, which browsers report as
  // ctrl-modified wheel events) -- zooms toward the cursor position.
  mapWrap.addEventListener("wheel", (e) => {
    if (!clusterState) return;
    e.preventDefault();
    const rect = mapCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const factor = Math.exp(-e.deltaY * 0.0015);
    zoomAt(mx, my, factor, rect.width, rect.height);
  }, { passive: false });

  // --- Drag to pan (mouse) ---
  let isDragging = false;
  let dragMoved = false;
  let dragStart = { x: 0, y: 0, tx: 0, ty: 0 };

  mapWrap.addEventListener("mousedown", (e) => {
    if (e.button !== 0 || !clusterState) return;
    isDragging = true;
    dragMoved = false;
    const rect = mapCanvas.getBoundingClientRect();
    dragStart = { x: e.clientX - rect.left, y: e.clientY - rect.top, tx: view.tx, ty: view.ty };
    mapCanvas.classList.add("dragging");
  });

  window.addEventListener("mousemove", (e) => {
    if (!isDragging) return;
    const rect = mapCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const dx = mx - dragStart.x;
    const dy = my - dragStart.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
    view.tx = dragStart.tx + dx;
    view.ty = dragStart.ty + dy;
    clampPan(rect.width, rect.height);
    redrawMap(hoverIndex);
  });

  window.addEventListener("mouseup", () => {
    if (!isDragging) return;
    isDragging = false;
    mapCanvas.classList.remove("dragging");
  });

  // --- Touch: one-finger pan, two-finger pinch zoom ---
  let touchState = null;

  mapWrap.addEventListener("touchstart", (e) => {
    if (!clusterState) return;
    const rect = mapCanvas.getBoundingClientRect();
    if (e.touches.length === 1) {
      const t = e.touches[0];
      touchState = { mode: "pan", x: t.clientX - rect.left, y: t.clientY - rect.top, tx: view.tx, ty: view.ty };
    } else if (e.touches.length === 2) {
      const [a, b] = e.touches;
      const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const cx = (a.clientX + b.clientX) / 2 - rect.left;
      const cy = (a.clientY + b.clientY) / 2 - rect.top;
      touchState = { mode: "pinch", dist: dist || 1, cx, cy, scale: view.scale, tx: view.tx, ty: view.ty };
    }
  }, { passive: true });

  mapWrap.addEventListener("touchmove", (e) => {
    if (!touchState) return;
    e.preventDefault();
    const rect = mapCanvas.getBoundingClientRect();
    if (touchState.mode === "pan" && e.touches.length === 1) {
      const t = e.touches[0];
      const mx = t.clientX - rect.left;
      const my = t.clientY - rect.top;
      view.tx = touchState.tx + (mx - touchState.x);
      view.ty = touchState.ty + (my - touchState.y);
      clampPan(rect.width, rect.height);
      redrawMap(hoverIndex);
    } else if (touchState.mode === "pinch" && e.touches.length === 2) {
      const [a, b] = e.touches;
      const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const factor = dist / touchState.dist;
      const newScale = clampNum(touchState.scale * factor, MIN_SCALE, MAX_SCALE);
      const applied = newScale / touchState.scale;
      view.scale = newScale;
      view.tx = touchState.cx - (touchState.cx - touchState.tx) * applied;
      view.ty = touchState.cy - (touchState.cy - touchState.ty) * applied;
      clampPan(rect.width, rect.height);
      redrawMap(hoverIndex);
    }
  }, { passive: false });

  function endTouch(e) {
    if (!touchState) return;
    if (e.touches.length === 0) {
      touchState = null;
      updateZoomControls();
    } else if (e.touches.length === 1) {
      const rect = mapCanvas.getBoundingClientRect();
      const t = e.touches[0];
      touchState = { mode: "pan", x: t.clientX - rect.left, y: t.clientY - rect.top, tx: view.tx, ty: view.ty };
    }
  }
  mapWrap.addEventListener("touchend", endTouch);
  mapWrap.addEventListener("touchcancel", endTouch);

  document.getElementById("zoom-in").addEventListener("click", () => {
    const rect = mapCanvas.getBoundingClientRect();
    zoomAt(rect.width / 2, rect.height / 2, 1.5, rect.width, rect.height);
  });
  document.getElementById("zoom-out").addEventListener("click", () => {
    const rect = mapCanvas.getBoundingClientRect();
    zoomAt(rect.width / 2, rect.height / 2, 1 / 1.5, rect.width, rect.height);
  });
  document.getElementById("zoom-reset").addEventListener("click", resetView);

  // --- Fragrance detail modal ---
  const detailOverlay = document.getElementById("detail-overlay");
  const detailFamily = document.getElementById("detail-family");
  const detailPerfume = document.getElementById("detail-perfume");
  const detailBrand = document.getElementById("detail-brand");
  const detailNotes = document.getElementById("detail-notes");
  const detailSimilarity = document.getElementById("detail-similarity");
  const detailSimilar = document.getElementById("detail-similar");
  const detailClose = document.getElementById("detail-close");

  let selectedPoint = null;

  // Matches from /analyze don't carry a cluster id (only sampled /clusters
  // points do) -- best-effort look one up by identity so the family eyebrow
  // still shows when the fragrance happens to be in the sampled set.
  function findFineForFragrance(point) {
    if (point.fine !== undefined) return point.fine;
    if (!clusterState) return undefined;
    const hit = clusterState.points.find(
      (p) => p.brand === point.brand && p.perfume === point.perfume && p.notes === point.notes
    );
    return hit ? hit.fine : undefined;
  }

  function openDetail(point, opts) {
    selectedPoint = point;
    const fineId = findFineForFragrance(point);
    const fine = fineId !== undefined ? clusterState.fineLabelById[fineId] : null;
    detailFamily.textContent = fine ? fine.label : "";
    detailPerfume.textContent = point.perfume;
    detailBrand.textContent = point.brand;
    detailNotes.textContent = point.notes;
    const similarity = opts && opts.similarity;
    detailSimilarity.textContent = similarity != null ? `${(similarity * 100).toFixed(1)}% similar to your notes` : "";
    detailOverlay.classList.add("visible");
  }

  function closeDetail() {
    detailOverlay.classList.remove("visible");
  }

  detailClose.addEventListener("click", closeDetail);
  detailOverlay.addEventListener("click", (e) => {
    if (e.target === detailOverlay) closeDetail();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeDetail();
      closeInfo();
    }
  });
  detailSimilar.addEventListener("click", () => {
    if (!selectedPoint) return;
    notesInput.value = selectedPoint.notes;
    closeDetail();
    analyze();
  });

  let mapResizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(mapResizeTimer);
    mapResizeTimer = setTimeout(() => {
      const rect = mapCanvas.getBoundingClientRect();
      clampPan(rect.width, rect.height);
      redrawMap(hoverIndex);
    }, 120);
  });

  async function loadClusters() {
    mapError.textContent = "";
    try {
      const res = await fetch(`${API_BASE}/clusters`);
      if (!res.ok) throw new Error(`Request failed (${res.status})`);
      const data = await res.json();
      clusterState = buildClusterState(data);
      renderLegend();
      redrawMap(-1);
      updateZoomControls();
    } catch (err) {
      mapError.textContent = err.message || "Failed to load the map.";
    }
  }

  function hideLoadingOverlay() {
    document.getElementById("loading-overlay").classList.add("hidden");
  }

  initTheme();
  const initialLoad = Promise.all([loadInfo(), loadClusters(), analyze()]);
  const loadTimeout = new Promise((resolve) => setTimeout(resolve, 12000));
  Promise.race([initialLoad, loadTimeout]).then(hideLoadingOverlay);
</script>
</body>
